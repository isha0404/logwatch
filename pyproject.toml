[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logwatch"
version = "1.0.0"
description = "Spot attacks on a small business server from its SSH login logs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Isha Inani" }]
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
logwatch = "logwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
